function showCategoriesMenu(){document.getElementById('categories-menu').style.display='block';document.getElementById('subcategories-view').style.display='none';document.getElementById('catalog-view').style.display='none';document.getElementById('searchInput').value=''}

function handleSearch(q){const t=q.toLowerCase().trim();if(!t){showCategoriesMenu();return}document.getElementById('categories-menu').style.display='none';document.getElementById('subcategories-view').style.display='none';document.getElementById('catalog-view').style.display='block';currentList=productos.filter(p=>p.titulo.toLowerCase().includes(t)||p.desc.toLowerCase().includes(t));visibleCount=12;render()}
function render(){const container=document.getElementById('catalog-container');container.innerHTML='';const slice=currentList.slice(0,visibleCount);if(!slice.length){container.innerHTML='<p style="text-align:center;color:#d1a3ac;padding:20px">No se encontraron productos.</p>';document.getElementById('loadMoreBtn').style.display='none';return}
slice.forEach((p,i)=>{const msg=encodeURIComponent(`Hola! Me interesa: *${p.titulo}* (${p.precio})`);const wa=`https://wa.me/${whatsappNumber}?text=${msg}`;const card=document.createElement('div');card.className='card';let varHtml='';if(p.imgs.length>1){varHtml='<div class="variants">'+p.imgs.map((im,j)=>`<img src="${im}" class="variant-thumb ${j===0?'active':''}" loading="lazy" onclick="changeImage(this,'img-${i}')" onerror="this.src='${PH}'">`).join('')+'</div>'};card.innerHTML=`<div class="img-container" onclick="openZoom(document.getElementById('img-${i}').src)"><img id="img-${i}" src="${p.imgs[0]}" alt="${p.titulo}" loading="lazy" onerror="this.src='${PH}'"><span class="zoom-hint">🔍 Toca para ampliar</span></div><div class="card-body"><h3 class="card-title">${p.titulo}</h3><p class="card-description">${p.desc}</p>${varHtml}<div class="card-price">${p.precio}</div><a href="${wa}" target="_blank" class="btn-whatsapp">Consultar por WhatsApp</a></div>`;container.appendChild(card)});document.getElementById('loadMoreBtn').style.display=visibleCount<currentList.length?'block':'none'}
function loadMore(){visibleCount+=12;render()}
function changeImage(el,id){const main=document.getElementById(id);main.src=el.src;el.parentElement.querySelectorAll('.variant-thumb').forEach(e=>e.classList.remove('active'));el.classList.add('active')}
function openZoom(src){document.getElementById('modalImage').src=src;document.getElementById('imageModal').style.display='flex'}
function closeZoom(){document.getElementById('imageModal').style.display='none'}
</script>
</body>
</html>
